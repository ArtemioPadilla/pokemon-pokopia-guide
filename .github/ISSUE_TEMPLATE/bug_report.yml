name: Bug report
description: Report a bug or unexpected behavior on the site itself (not a content error)
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! Fill in as much detail as
        you can. **Tip:** the "Report an issue" button on the live site will
        auto-fill environment/diagnostics info for you.

  - type: input
    id: title
    attributes:
      label: Summary
      placeholder: Short description of the bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics (optional)
      description: Paste the diagnostics copied from the "Report an issue" button, if available
      placeholder: |
        Environment: ...
        Console errors: ...
        Failed requests: ...
      render: text
